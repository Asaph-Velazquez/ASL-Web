services:
  asl-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: asl-server
    env_file:
      - .env
    environment:
      PORT: 3001
      HTTPS_PORT: 3002
      NODE_ENV: production
      USE_HTTPS: "false"
      MONGODB_URI: mongodb://mongodb:27017/asl-hotel
      GLOSS_TRANSLATOR_URL: http://asl-gloss-translator:8000
      GLOSS_TRANSLATOR_TIMEOUT_MS: "10000"
    ports:
      - "3001:3001"
    depends_on:
      mongodb:
        condition: service_started
      asl-gloss-translator:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  asl-gloss-translator:
    image: asl-gloss-translator:local
    build:
      context: ../..
      dockerfile: ASL-GlossTranslator/Dockerfile
    environment:
      TRANSLATOR_THREADS: "2"
      TRANSLATOR_TIMEOUT_SECONDS: "10"
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: asl-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

volumes:
  mongodb_data:
